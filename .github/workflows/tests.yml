name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # setup-homebrew checks this repository out as a tap already, so there is
      # nothing to link by hand.
      #
      # Pinned by commit, not by a branch. `@master` stopped resolving the day
      # Homebrew/actions renamed its default branch to `main`, and every push
      # here failed in "Set up job" before a step ran. `@main` would be the same
      # bet placed again: a moving ref means whatever is at its tip runs with
      # this repository's token, and the tap is what `brew install` trusts.
      - name: Set up Homebrew
        id: setup
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Style and `readall` across every formula in the tap.
      - run: brew test-bot --only-tap-syntax

      # Building kronk-cli needs a published release tarball; enable this once
      # v0.1.0 is tagged.
      # - run: brew test-bot --only-formulae
      #   if: github.event_name == 'pull_request'
